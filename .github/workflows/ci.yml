name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check
      - run: npm test

  publish:
    needs: test
    if: >-
      github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11
      - run: npm ci
      # Trusted publishing (OIDC, no stored token) plus staged publishing: CI can
      # only upload to the staging area, so a maintainer approves with 2FA
      # (`npm stage approve <id>` or the npmjs.com Staged Packages tab) before a
      # version goes live. Provenance is generated for the staged tarball.
      - run: npm stage publish
